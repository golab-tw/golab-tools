<script>
try {
  if (/[?&]lock\b/.test(location.search)) localStorage.removeItem('golab-key');
  // 每天要重新輸入一次密碼：記住的密碼只在輸入的那一天（台北時間）有效
  var gDay = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei' }).format(new Date());
  if (localStorage.getItem('golab-key') && localStorage.getItem('golab-key-day') !== gDay) { localStorage.removeItem('golab-key'); window.GOLAB_NEWDAY = true; }
  if (localStorage.getItem('golab-key')) document.documentElement.className = 'auto';
  var t0 = localStorage.getItem('golab-theme');
  if (t0 === 'light' || t0 === 'dark') document.documentElement.setAttribute('data-theme', t0);
} catch (e) { /* 無痕模式：每次都要輸入密碼 */ }
</script>

<style>
/* Layout: the page's own cobalt band (same proportions as every GOLAB tool) with a single password field under it. */
:root{--paper:#0E0E10;--ink:#F6F6F8;--mute:#9296A2;--line:#2A2C33;--line-2:#41444D;--card:#16171A;--rec:#FF4B3E;--signal-ink:#4CFF3F;--btn:#062BA0;--btn-ink:#FFFFFF;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--paper:#F6F6F8;--ink:#0E0E10;--mute:#5B5F6B;--line:#DCDEE4;--line-2:#B9BCC4;--card:#FFFFFF;--rec:#D42A1C;--signal-ink:#0C7A18;color-scheme:light}}
:root[data-theme="light"]{--paper:#F6F6F8;--ink:#0E0E10;--mute:#5B5F6B;--line:#DCDEE4;--line-2:#B9BCC4;--card:#FFFFFF;--rec:#D42A1C;--signal-ink:#0C7A18;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper)}
body{color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#062BA0}
.auto body>*{visibility:hidden}
/* ═══ GOLAB 共用頁首（四個網站完全相同，不要個別修改）═══
   高度＝HUD 16+32 ＋ 標題區 clamp(22px,3.2vw,40px)+標題 .95em+12+副標兩行+18 ＋ 底列 48 */
.gb{--gb-cobalt:#062BA0;--gb-fg:#F5F5F7;--gb-sky:#8DB1FF;--gb-signal:#4CFF3F;--gb-rec:#FF4B3E;
  --gb-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gb-wide:"Archivo","Helvetica Neue",Arial,sans-serif;
  --gb-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --gb-body:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  position:relative;overflow:hidden;background:var(--gb-cobalt);color:var(--gb-fg);-webkit-font-smoothing:antialiased}
.gb::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(90deg,transparent 31px,rgba(255,255,255,.22) 31px,rgba(255,255,255,.22) 32px,transparent 32px),linear-gradient(transparent 31px,rgba(255,255,255,.22) 31px,rgba(255,255,255,.22) 32px,transparent 32px);
  background-size:64px 64px;
  -webkit-mask:radial-gradient(circle at 32px 32px,#000 4.6px,transparent 5px) 0 0/64px 64px;
          mask:radial-gradient(circle at 32px 32px,#000 4.6px,transparent 5px) 0 0/64px 64px}
.gb-wrap{position:relative;max-width:1240px;margin-inline:auto;
  padding-left:max(clamp(16px,4vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,40px),env(safe-area-inset-right,0px))}
.gb-hud{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-top:16px;height:48px;
  font:400 11px/1.45 var(--gb-mono);letter-spacing:.08em;text-transform:uppercase}
.gb-hud b{display:block;font-weight:500;letter-spacing:.14em}
.gb-hud span{display:block;opacity:.72}
.gb-hud .gb-r{text-align:right}
.gb-hr{display:flex;align-items:flex-start;gap:12px}
.gb-btns{flex:none;display:flex;gap:6px}
.gb-refresh,.gb-icon{flex:none;width:32px;height:32px;padding:0;border:1px solid rgba(255,255,255,.35);border-radius:0;background:none;color:var(--gb-fg);
  display:grid;place-items:center;cursor:pointer;transition:border-color .2s,background .2s}
.gb-refresh svg,.gb-icon svg{width:15px;height:15px}
.gb-icon:hover{border-color:var(--gb-fg);background:rgba(255,255,255,.08)}
.gb-refresh:hover{border-color:var(--gb-fg);background:rgba(255,255,255,.08)}
.gb-refresh.busy svg,.gb-refresh.spin svg{animation:gbSpin .8s linear infinite}
.gb-refresh.err{border-color:var(--gb-rec);color:var(--gb-rec)}
.gb-refresh.pulse{animation:gbFlash .7s ease-out}
.gb-stat{white-space:nowrap;font-variant-numeric:tabular-nums;opacity:.85}
.gb-hud a{color:inherit;text-decoration:none}
.gb-hero{padding-top:clamp(22px,3.2vw,40px);padding-bottom:18px}
.gb-title{margin:0;display:flex;align-items:baseline;gap:.28em;white-space:nowrap;overflow:hidden;
  font-size:clamp(40px,11vw,96px);line-height:.95;padding-bottom:.06em;font-weight:inherit}
.gb-zh,.gb-en{display:inline-block;animation:gbRise .8s cubic-bezier(.16,.84,.24,1) both}
.gb-zh{font-family:var(--gb-zh);font-weight:900;letter-spacing:.02em;animation-delay:.06s}
.gb-en{font-family:var(--gb-wide);font-stretch:125%;font-weight:800;font-size:.6em;letter-spacing:.01em;color:var(--gb-sky);animation-delay:.18s}
.gb-sub{margin:12px 0 0;font:400 14px/1.6 var(--gb-body);opacity:.82;max-width:34em;height:3.2em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gb-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;height:48px;border-top:1px solid rgba(255,255,255,.2);
  font:400 11px/1 var(--gb-mono);letter-spacing:.08em;text-transform:uppercase}
.gb-af{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-width:0;overflow:hidden}
.gb-af i{flex:none;width:8px;height:8px;background:var(--gb-signal)}
.gb-af b{font-weight:500;color:var(--gb-signal)}
.gb-af.rec i{border-radius:50%;animation:gbBlink 2.4s steps(1) infinite}
.gb-af.busy i{background:transparent;outline:1px solid var(--gb-fg);animation:none}
.gb-af.err i{background:var(--gb-rec);animation:none}
.gb-af.err b{color:var(--gb-rec)}
.gb-af.searching i{background:transparent;outline:1px solid var(--gb-fg)}
.gb-af.searching b{color:var(--gb-fg);opacity:.75}
.gb-tools{flex:none;display:inline-flex;align-items:center;gap:8px}
.gb-btn{height:28px;min-width:28px;padding:0 9px;border:1px solid rgba(255,255,255,.35);border-radius:0;background:none;color:var(--gb-fg);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;letter-spacing:inherit;text-transform:inherit;text-decoration:none;cursor:pointer;white-space:nowrap}
.gb-btn:hover{border-color:var(--gb-fg);background:rgba(255,255,255,.08)}
.gb-btn svg{width:14px;height:14px;flex:none}
.gb-btn .gb-dot{width:7px;height:7px;border-radius:50%;background:var(--gb-signal)}
.gb-btn.busy .gb-dot{animation:gbBlink .8s steps(2) infinite}
.gb-btn.err .gb-dot{background:var(--gb-rec)}
.gb-btn.pulse .gb-dot{animation:gbPing 1.2s cubic-bezier(.2,.75,.2,1)}
.gb :focus-visible{outline:2px solid var(--gb-signal);outline-offset:2px}
@keyframes gbRise{from{transform:translateY(108%)}to{transform:none}}
@keyframes gbPing{0%{box-shadow:0 0 0 0 rgba(76,255,63,.7)}100%{box-shadow:0 0 0 9px rgba(76,255,63,0)}}
@keyframes gbSpin{to{transform:rotate(360deg)}}
@keyframes gbFlash{0%{background:rgba(76,255,63,.4)}100%{background:transparent}}
@keyframes gbBlink{0%,70%{opacity:1}71%,100%{opacity:.25}}
@media (max-width:420px){.gb-hud,.gb-bar{font-size:10.5px}.gb-btn{padding:0 7px}.gb-btn .gb-lbl{display:none}}
@media (prefers-reduced-motion:reduce){.gb-zh,.gb-en,.gb-af i,.gb-btn .gb-dot,.gb-refresh,.gb-refresh svg{animation:none!important}}

.gb-logo{display:inline-block;height:.95em}
.gb-logo img{display:block;height:100%;width:auto}
.gb-title .gb-en.gb-hubtag{font-family:var(--gb-zh);font-stretch:normal;font-weight:900;font-size:clamp(34px,4vw,46px);letter-spacing:.03em;color:var(--gb-fg)}
.gb-hero-hub .gb-title{transform:translateY(28.4px);align-items:flex-end}
.gb-title .gb-en.gb-hubtag{line-height:1;position:relative;top:.07em}
.gate{max-width:1240px;margin:0 auto;padding:32px max(clamp(16px,4vw,40px),env(safe-area-inset-right,0px)) 48px max(clamp(16px,4vw,40px),env(safe-area-inset-left,0px))}
.gate form{max-width:460px;animation:gIn .6s cubic-bezier(.16,.84,.24,1) .15s both}
.gate label{display:flex;justify-content:space-between;align-items:baseline;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.gate label b{font:600 15px/1 var(--sans);letter-spacing:.02em;color:var(--ink);text-transform:none}
.g-row{display:flex;border:1px solid var(--line-2);background:var(--card);transition:border-color .2s}
.g-row:focus-within{border-color:var(--ink)}
.g-row.bad{border-color:var(--rec);animation:gShake .36s}
.g-row input{flex:1;min-width:0;height:54px;padding:0 14px;border:0;background:none;color:var(--ink);font:500 19px/1 var(--mono);letter-spacing:.1em;outline:none}
.g-row input::placeholder{color:var(--line-2);letter-spacing:.1em}
.g-eye{flex:none;width:48px;border:0;border-left:1px solid var(--line);background:none;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.g-eye svg{width:18px;height:18px}
.g-eye[aria-pressed="true"]{color:var(--ink)}
.g-go{width:100%;height:54px;margin-top:10px;border:0;background:var(--btn);color:var(--btn-ink);font:600 16px/1 var(--sans);letter-spacing:.12em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.g-go:hover{filter:brightness(1.15)}
.g-go[disabled]{cursor:progress;filter:none;opacity:.85}
.g-go i{width:8px;height:8px;background:var(--gb-signal,#4CFF3F);display:none}
.g-go[disabled] i{display:block;animation:gbBlink .8s steps(2) infinite}
.g-msg{min-height:1.6em;margin-top:12px;color:var(--rec);font-weight:600}
.g-msg.info{color:var(--mute);font-weight:500}
.g-note{margin-top:4px;color:var(--mute);font-size:13.5px;max-width:30em}
.g-user{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--signal-ink);outline-offset:2px}
.g-row input:focus-visible{outline:none}
@keyframes gIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes gShake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.gate form,.g-row.bad,.g-go[disabled] i{animation:none!important}}
</style>
</head>
<body>
<header class="gb">
  <div class="gb-wrap">
    <div class="gb-hud"><a href="./" title="回首頁"><b>GOLAB®</b><span>Camera Rental</span></a><div class="gb-hr"><div class="gb-r"><b>Taipei</b><span>SC 03 / 05</span></div><div class="gb-btns"><button class="gb-icon" id="themeBtn" type="button" aria-label="切換深色／淺色" title="切換深色／淺色"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button><a class="gb-icon" href="./" title="回首頁" aria-label="回首頁"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5V13H10V9.5H6V13H2.5z"/></svg></a></div></div></div>
    <div class="gb-hero">
      <h1 class="gb-title" aria-label="客服回覆 Q&amp;A"><span class="gb-zh">客服回覆</span><span class="gb-en">Q&amp;A</span></h1>
      <p class="gb-sub">常用客服回覆範本，搜尋或點分類後一鍵複製貼到 LINE。〔 〕欄位記得改，價格與租期以官網為準。</p>
    </div>
    <div class="gb-bar">
      <span class="gb-af err"><i></i>LOCK <b>需要密碼</b></span>
      <span class="gb-tools"></span>
    </div>
  </div>
</header>
<main class="gate">
  <!-- 下面的程式還沒載入前按 Enter：不要送出表單（否則密碼會出現在網址上），先記下來，程式載入後自動解鎖 -->
  <form id="gateForm" autocomplete="on" novalidate action="javascript:void 0" onsubmit="window.GOLAB_PENDING=true;return false">
    <input class="g-user" type="text" name="username" value="golab" autocomplete="username" tabindex="-1" aria-hidden="true">
    <label for="pw"><b>輸入密碼</b><span>Password</span></label>
    <div class="g-row" id="row">
      <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="xxxx-xxxx-xxxx" aria-describedby="msg note">
      <button class="g-eye" id="eye" type="button" aria-pressed="false" aria-label="顯示密碼" title="顯示密碼"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button class="g-go" id="go" type="submit"><i></i><span>進入</span></button>
    <p class="g-msg" id="msg" role="alert" aria-live="assertive"></p>
    <p class="g-note" id="note">GOLAB 內部工具僅限同仁使用。輸入一次後，這台裝置之後就不用再輸入。</p>
  </form>
  <noscript><p class="g-msg">請開啟瀏覽器的 JavaScript 才能使用。</p></noscript>
</main>

<script>
(function () {
  'use strict';
  var SALT = 'IlJ8OVlaY6L1epHOYpE3fg==', ITER = 600000;
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  function b64d(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function b64e(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function load() { try { return localStorage.getItem('golab-key'); } catch (e) { return null; } }
  function today() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei' }).format(new Date()); }
  function save(v) { try { localStorage.setItem('golab-key', v); localStorage.setItem('golab-key-day', today()); } catch (e) { /* 無痕模式 */ } }
  function forget() { try { localStorage.removeItem('golab-key'); } catch (e) { /* 忽略 */ } }
  var subtle = window.crypto && window.crypto.subtle;
  var data = b64d($('payload').textContent.replace(/\s+/g, '')), iv = data.slice(0, 12), ct = data.slice(12);

  function open(raw) {
    return subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt'])
      .then(function (k) { return subtle.decrypt({ name: 'AES-GCM', iv: iv }, k, ct); })
      .then(function (pt) { return new TextDecoder().decode(pt); });
  }
  function show(html) {
    // 必須等這一頁解析完才換掉整份文件；解析中呼叫 document.open 會被忽略，內容會被插進原本的頁面
    var go = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(go, 0); });
    else go();
  }
  function derive(pw) {
    var norm = String(pw).toLowerCase().replace(/[^a-z0-9]/g, '');
    return subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) { return subtle.deriveBits({ name: 'PBKDF2', salt: b64d(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256); })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  function msg(t, info) { $('msg').textContent = t || ''; $('msg').classList.toggle('info', !!info); }
  function gate(t, info) {
    root.classList.remove('auto');
    msg(t, info);
    if (matchMedia('(hover:hover)').matches) $('pw').focus();
  }

  $('eye').addEventListener('click', function () {
    var on = $('pw').type === 'password';
    $('pw').type = on ? 'text' : 'password';
    this.setAttribute('aria-pressed', String(on));
    this.setAttribute('aria-label', on ? '隱藏密碼' : '顯示密碼');
  });
  $('pw').addEventListener('input', function () { $('row').classList.remove('bad'); msg(''); });
  var tb = $('themeBtn');
  if (tb) tb.addEventListener('click', function () {
    var cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    var next = cur === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('golab-theme', next); } catch (e) { /* 忽略 */ }
  });
  (function clock() {
    var el = $('clock'); if (!el) return;
    var n = new Date(), p = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).formatToParts(n).forEach(function (x) { p[x.type] = x.value; });
    el.textContent = p.hour + ':' + p.minute + ':' + p.second;
    setTimeout(clock, 1000 - n.getMilliseconds());
  })();

  var busy = false;
  function unlock(ev) {
    if (ev) ev.preventDefault();
    window.GOLAB_PENDING = false;
    if (busy || !subtle) return;
    var pw = $('pw').value;
    if (!pw.replace(/[^a-z0-9]/gi, '')) { $('row').classList.add('bad'); msg('請輸入密碼'); $('pw').focus(); return; }
    busy = true; $('go').disabled = true; $('go').lastChild.textContent = '解鎖中'; msg('');
    derive(pw).then(function (raw) {
      return open(raw).then(function (html) { save(b64e(raw)); show(html); });
    }).catch(function () {
      busy = false; $('go').disabled = false; $('go').lastChild.textContent = '進入';
      var r = $('row'); r.classList.remove('bad'); void r.offsetWidth; r.classList.add('bad');
      msg('密碼不正確，請再試一次'); $('pw').select();
    });
  }
  $('gateForm').addEventListener('submit', unlock);
